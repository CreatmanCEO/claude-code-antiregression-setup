<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">
  <title>Hook blocking a git commit when pytest fails</title>
  <desc>Demo: PreToolUse hook in claude-code-antiregression-setup runs pytest before every git commit. When tests fail, the commit is blocked with an explicit message. When tests pass, the commit proceeds.</desc>

  <!-- Window chrome -->
  <rect x="0" y="0" width="900" height="520" rx="10" ry="10" fill="#1e1e1e"/>
  <rect x="0" y="0" width="900" height="34" rx="10" ry="10" fill="#2d2d2d"/>
  <rect x="0" y="24" width="900" height="10" fill="#2d2d2d"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="450" y="22" fill="#888" font-size="12" text-anchor="middle">cc-demo — claude code · anti-regression hook</text>

  <!-- Body -->
  <g font-size="14" fill="#d4d4d4">
    <!-- prompt 1: user requests commit -->
    <text x="20" y="68"><tspan fill="#27c93f">creatman@mac</tspan><tspan fill="#888"> </tspan><tspan fill="#3b9eff">cc-demo</tspan><tspan fill="#888"> $ </tspan><tspan fill="#d4d4d4">claude</tspan></text>

    <text x="20" y="94" fill="#888">╭──────────────────────────────────────────────────────────────────────────╮</text>
    <text x="20" y="112" fill="#888">│</text>
    <text x="40" y="112" fill="#cc785c">claude</text>
    <text x="100" y="112" fill="#d4d4d4">  Read CLAUDE.md · CRITICAL RULES loaded · /agents available</text>
    <text x="876" y="112" fill="#888" text-anchor="end">│</text>
    <text x="20" y="130" fill="#888">╰──────────────────────────────────────────────────────────────────────────╯</text>

    <text x="20" y="160"><tspan fill="#888">&gt; </tspan><tspan fill="#d4d4d4">git add -A &amp;&amp; git commit -m "feat: ship divide function"</tspan></text>

    <!-- hook fires -->
    <text x="20" y="196" fill="#dcdcaa">[HOOK] Running tests before commit...</text>

    <text x="20" y="222" fill="#888">════════════════════════════════ test session ═══════════════════════════════</text>
    <text x="20" y="244" fill="#d4d4d4">collected 3 items</text>

    <text x="20" y="270"><tspan fill="#d4d4d4">tests/test_calculator.py </tspan><tspan fill="#27c93f">.</tspan><tspan fill="#27c93f">.</tspan><tspan fill="#ff5f56">F</tspan><tspan fill="#888">                                              [100%]</tspan></text>

    <text x="20" y="300" fill="#ff5f56">FAILED tests/test_calculator.py::test_divide_by_zero</text>
    <text x="20" y="318" fill="#888">  ZeroDivisionError: division by zero — expected ValueError</text>

    <text x="20" y="346" fill="#888">════════════════════════ 1 failed, 2 passed in 0.04s ════════════════════════</text>

    <!-- block decision -->
    <rect x="14" y="368" width="872" height="56" rx="6" fill="#2a1414" stroke="#ff5f56" stroke-width="1.5"/>
    <text x="32" y="392" fill="#ff5f56" font-weight="bold">✕ Commit blocked</text>
    <text x="32" y="412" fill="#f4d4d4">Tests are failing. Fix all test failures before committing.</text>

    <!-- claude reaction -->
    <text x="20" y="456"><tspan fill="#cc785c">claude </tspan><tspan fill="#888">→ </tspan><tspan fill="#d4d4d4">I'll fix </tspan><tspan fill="#3b9eff">calculator.py</tspan><tspan fill="#d4d4d4"> to raise </tspan><tspan fill="#dcdcaa">ValueError</tspan><tspan fill="#d4d4d4"> on b == 0, then retry.</tspan></text>

    <!-- Animated cursor -->
    <rect x="20" y="478" width="10" height="16" fill="#d4d4d4">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Caption strip -->
  <rect x="0" y="498" width="900" height="22" fill="#0d1117"/>
  <text x="450" y="513" font-size="11" fill="#7d8590" text-anchor="middle">PreToolUse hook on Bash(git commit*) → pytest -x --timeout=60 → block on failure · settings.json @ claude-code-antiregression-setup</text>
</svg>
